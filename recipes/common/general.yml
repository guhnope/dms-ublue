---
modules:
  - type: rpm-ostree
    repos:
      - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
    keys:
      - https://repos.fyralabs.com/terra44/key.asc
    install:
      - fish
      - ghostty
      - grim
      - slurp
      - mako
      - helix
      - matugen
      - cliphist
      - greetd
      - greetd-selinux
      - wl-clipboard
      - wlsunset
      - imv
      - ffmpeg
      - x264
      - x265
      - keepassxc
      - zed
      - network-manager-applet
      - helium-browser-bin
      - caja
      - atril
      - engrampa
      - paperwork    remove:
      - vim-minimal
      - vim-enhanced
      - firefox
      - firefox-langpacks
  - type: systemd
    system:
      enabled:
        - greetd
        - firewalld
  - type: files
    files:
      - source: system
        destination: /
