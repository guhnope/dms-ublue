---
modules:
  - type: dnf
    install:
      packages:
        - niri
        - xwayland-satellite
        - xdg-desktop-portal-gtk
        - noctalia-git
        - noctalia-greeter
      exclude:
        - alacritty
        - waybar
        - fuzzel
  - type: files
    files:
      - source: niri
        destination: /
