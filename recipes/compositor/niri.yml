---
modules:
  - type: dnf
    install:
      packages:
        - niri
        - xwayland-satellite
        - xdg-desktop-portal-gtk
        - noctalia-git
        - noctalia-greeter
        - adw-gtk3-theme
        - qt6ct
      exclude:
        - alacritty
        - waybar
        - fuzzel
        - gnome-keyring
  - type: files
    files:
      - source: niri
        destination: /
